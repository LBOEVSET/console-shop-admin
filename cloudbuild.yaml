steps:

# 1️⃣ Authenticate to GKE cluster
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'auth-cluster'
  entrypoint: gcloud
  args:
    - container
    - clusters
    - get-credentials
    - console-shop-cluster
    - --zone=asia-southeast1-c
    - --project=$PROJECT_ID

# 2️⃣ Build Docker image (NEXT_PUBLIC_API_URL baked at build time)
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
    - build
    - --build-arg
    - NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL
    - -t
    - asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/admin-web:$SHORT_SHA
    - .

# 3️⃣ Push Docker image
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  args:
    - push
    - asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/admin-web:$SHORT_SHA

# 4️⃣ Deploy new image to GKE
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'deploy'
  args:
    - set
    - image
    - deployment/admin-web
    - admin-web=asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/admin-web:$SHORT_SHA
    - --namespace=console-shop
  env:
    - CLOUDSDK_COMPUTE_ZONE=asia-southeast1-c
    - CLOUDSDK_CONTAINER_CLUSTER=console-shop-cluster

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/admin-web:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
